<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPG扫描</title>
  <meta name="description" content="CPG扫描 — 港股/海外/A股 趋势热点扫描 (五部曲)" />
  <script src="lib/lightweight-charts.standalone.js" defer></script>
  <style>
    :root {
      --bg: #ffffff;
      --bg-card: #f9fafb;
      --bg-muted: #f3f4f6;
      --border: #e5e7eb;
      --text: #111827;
      --text-muted: #6b7280;
      --text-xs: #9ca3af;
      --primary: #2563eb;
      --positive: #16a34a;
      --positive-bg: rgba(22,163,74,0.08);
      --negative: #dc2626;
      --negative-bg: rgba(220,38,38,0.08);
      --hover: rgba(0,0,0,0.03);
      --state-strong: #16a34a;
      --state-strong-bg: rgba(22,163,74,0.12);
      --state-mid: #2563eb;
      --state-mid-bg: rgba(37,99,235,0.10);
      --state-early: #8b5cf6;
      --state-early-bg: rgba(139,92,246,0.10);
      --state-new: #f59e0b;
      --state-new-bg: rgba(245,158,11,0.12);
      --state-pullback: #ea580c;
      --state-pullback-bg: rgba(234,88,12,0.10);
      --state-exit: #9ca3af;
      --state-exit-bg: rgba(156,163,175,0.10);
      --state-pool: #d1d5db;
      --state-pool-bg: rgba(209,213,219,0.10);
      --state-setup-ok: #0ea5e9;
      --state-setup-ok-bg: rgba(14,165,233,0.10);
      --state-entangled: #a3a3a3;
      --state-entangled-bg: rgba(163,163,163,0.10);
    }
    .dark {
      --bg: #0f1117;
      --bg-card: #1a1d27;
      --bg-muted: #22252f;
      --border: #2d3039;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-xs: #64748b;
      --primary: #60a5fa;
      --positive: #4ade80;
      --positive-bg: rgba(74,222,128,0.1);
      --negative: #f87171;
      --negative-bg: rgba(248,113,113,0.1);
      --hover: rgba(255,255,255,0.03);
      --state-strong: #4ade80;
      --state-strong-bg: rgba(74,222,128,0.12);
      --state-mid: #60a5fa;
      --state-mid-bg: rgba(96,165,250,0.12);
      --state-early: #a78bfa;
      --state-early-bg: rgba(167,139,250,0.12);
      --state-new: #fbbf24;
      --state-new-bg: rgba(251,191,36,0.15);
      --state-pullback: #fb923c;
      --state-pullback-bg: rgba(251,146,60,0.12);
      --state-exit: #64748b;
      --state-exit-bg: rgba(100,116,139,0.10);
      --state-pool: #4b5563;
      --state-pool-bg: rgba(75,85,99,0.10);
      --state-setup-ok: #38bdf8;
      --state-setup-ok-bg: rgba(56,189,248,0.12);
      --state-entangled: #737373;
      --state-entangled-bg: rgba(115,115,115,0.10);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }
    .header {
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(8px);
    }
    .header-inner {
      max-width: 1600px; margin: 0 auto;
      padding: 10px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { color: var(--primary); flex-shrink: 0; }
    .title { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
    .subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .tab-toggle {
      display: inline-flex; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-muted); padding: 2px;
    }
    .tab-btn {
      padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: none; background: none; color: var(--text-muted);
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: var(--bg); color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .tab-btn .tab-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 16px; border-radius: 8px; font-size: 10px;
      font-weight: 700; margin-left: 4px; padding: 0 4px;
      background: var(--bg-muted); color: var(--text-muted);
    }
    .tab-btn.active .tab-count {
      background: var(--primary); color: white;
    }
    .icon-btn {
      width: 32px; height: 32px; border-radius: 6px; border: none;
      background: none; color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: var(--bg-muted); }
    .badge {
      display: inline-flex; align-items: center; padding: 2px 8px;
      border-radius: 4px; font-size: 11px; background: var(--bg-muted);
      color: var(--text-muted); white-space: nowrap; gap: 3px;
    }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .state-badge {
      display: inline-flex; align-items: center; padding: 2px 7px;
      border-radius: 4px; font-size: 11px; font-weight: 600;
      white-space: nowrap; gap: 3px;
    }
    .state-STRONG { color: var(--state-strong); background: var(--state-strong-bg); }
    .state-MID { color: var(--state-mid); background: var(--state-mid-bg); }
    .state-EARLY { color: var(--state-early); background: var(--state-early-bg); }
    .state-NEW { color: var(--state-new); background: var(--state-new-bg); }
    .state-PULLBACK { color: var(--state-pullback); background: var(--state-pullback-bg); }
    .state-EXIT { color: var(--state-exit); background: var(--state-exit-bg); }
    .state-POOL { color: var(--state-pool); background: var(--state-pool-bg); }
    .state-SETUP_OK { color: var(--state-setup-ok); background: var(--state-setup-ok-bg); }
    .state-ENTANGLED { color: var(--state-entangled); background: var(--state-entangled-bg); }
    .sos-badge {
      display: inline-flex; align-items: center; padding: 1px 5px;
      border-radius: 3px; font-size: 10px; font-weight: 700;
      color: #fff; margin-left: 4px;
    }
    .sos-A { background: #15803d; }
    .sos-B { background: #4ade80; color: #166534; }
    .sos-C { background: #93c5fd; color: #1e3a5f; }
    .bear-badge {
      display: inline-flex; align-items: center; padding: 1px 5px;
      border-radius: 3px; font-size: 10px; font-weight: 700;
      color: #fff; background: #6b7280; margin-left: 4px;
    }
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 10px; flex-wrap: wrap;
    }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .search-input {
      height: 32px; padding: 0 10px 0 30px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 13px; width: 220px; outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .btn {
      height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 12px; font-weight: 500;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.15s; white-space: nowrap;
    }
    .btn:hover { background: var(--bg-muted); }
    .btn.copied { border-color: var(--positive); color: var(--positive); }
    .stats { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 12px; }
    .stats-num { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
    .table-wrap {
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-card); overflow: hidden;
    }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
    thead { background: var(--bg-muted); position: sticky; top: 0; z-index: 10; }
    th {
      padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted);
      cursor: pointer; white-space: nowrap; user-select: none; transition: color 0.15s;
    }
    th:hover { color: var(--text); }
    th.active { color: var(--primary); }
    th .sort-icon { display: inline-flex; margin-left: 3px; opacity: 0.3; vertical-align: middle; }
    th.active .sort-icon { opacity: 1; }
    td { padding: 6px 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    tr { border-top: 1px solid var(--border); transition: background 0.1s; }
    thead tr { border-top: none; }
    tbody tr:hover { background: var(--hover); }
    .ticker { font-weight: 600; font-size: 13px; letter-spacing: -0.01em; width: 7%; overflow: hidden; text-overflow: ellipsis; }
    .ticker a { color: var(--primary); text-decoration: none; cursor: pointer; }
    .ticker a:hover { text-decoration: underline; }
    .tk-link { color: var(--primary); text-decoration: none; cursor: pointer; font-weight: 600; }
    .tk-link:hover { text-decoration: underline; }
    .rot-banner { display:flex; gap:10px; margin:8px 0 12px; flex-wrap:wrap; }
    .rot-box { flex:1; min-width:280px; border-radius:8px; padding:10px 12px; font-size:13px; font-weight:600; }
    .rot-lose { background: rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.45); }
    .rot-gain { background: rgba(34,197,94,0.12); border:1px solid rgba(34,197,94,0.45); }
    .rot-list { margin-top:6px; display:flex; flex-wrap:wrap; gap:6px 12px; font-weight:400; }
    .rot-item { font-size:12px; white-space:nowrap; }
    .name { font-size: 12px; color: var(--text-muted); width: 12%; overflow: hidden; text-overflow: ellipsis; }
    .sector { font-size: 12px; color: var(--text-muted); width: 10%; overflow: hidden; text-overflow: ellipsis; }
    .price { font-weight: 500; }
    .muted-val { font-size: 12px; color: var(--text-muted); }
    .empty-state { padding: 48px 12px; text-align: center; color: var(--text-muted); }
    .empty-state p { font-size: 13px; }
    .alert-card {
      padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-card); margin-bottom: 8px; display: flex;
      align-items: center; gap: 12px;
    }
    .alert-card .alert-ticker { font-weight: 700; font-size: 14px; min-width: 80px; }
    .alert-card .alert-ticker a { color: var(--text); text-decoration: none; cursor: pointer; }
    .alert-card .alert-ticker a:hover { color: var(--primary); text-decoration: underline; }
    .alert-card .alert-name { font-size: 13px; color: var(--text-muted); min-width: 100px; }
    .alert-card .alert-detail { font-size: 13px; color: var(--text-muted); }
    .alert-card .alert-sector { font-size: 12px; color: var(--text-xs); }
    .alert-card .alert-date { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .footer { margin-top: 24px; padding-bottom: 16px; text-align: center; }
    .footer a { font-size: 12px; color: var(--text-xs); text-decoration: none; }
    .footer a:hover { color: var(--text-muted); }
    .group-header {
      padding: 8px 12px; background: var(--bg-muted); font-size: 13px; font-weight: 700;
      color: var(--text); border-top: 2px solid var(--primary);
      display: flex; align-items: center; gap: 10px;
    }
    .group-header .group-count {
      font-size: 11px; font-weight: 600; color: var(--primary);
      background: var(--bg); padding: 1px 7px; border-radius: 8px;
    }
    .btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .main { max-width: 1600px; margin: 0 auto; padding: 16px 20px; }
    .summary-bar {
      display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .summary-item {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px;
      border-radius: 6px; background: var(--bg-muted); font-size: 12px;
    }
    .summary-item .summary-label { color: var(--text-muted); }
    .summary-item .summary-val { font-weight: 700; font-variant-numeric: tabular-nums; }
    .section-divider {
      margin: 16px 0 8px; padding: 6px 12px; background: var(--bg-muted);
      border-radius: 6px; font-size: 14px; font-weight: 700; color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .section-divider .section-count {
      font-size: 11px; font-weight: 700; color: var(--primary);
      background: var(--bg); padding: 1px 6px; border-radius: 8px;
    }
    .tier-badge-STRONG { color: var(--state-strong); background: var(--state-strong-bg); }
    .tier-badge-STRONG-NEW { color: var(--state-new); background: var(--state-new-bg); }
    .tier-badge-MID { color: var(--state-mid); background: var(--state-mid-bg); }
    .tier-badge-EARLY { color: var(--state-early); background: var(--state-early-bg); }
    .chg-badge { font-size: 12px; font-weight: 600; }
    .chg-pos { color: var(--positive); }
    /* 基本面列: 窄体等大字体; YoY绿随加速加深(1→3级), 负值红; ROE>=12%绿其余默认 */
    .yoy-g1  { color:#4ade80; }
    .yoy-g2  { color:#22c55e; font-weight:600; }
    .yoy-g3  { color:#16a34a; font-weight:700; }
    .yoy-neg { color:#ef4444; }
    .roe-g   { color:#16a34a; font-weight:600; }
    .fund-td { font-family:'Arial Narrow','Segoe UI','Microsoft YaHei',sans-serif; white-space:nowrap; }
    td.grp-start, th.grp-start { border-left:2px solid rgba(127,127,127,.45); }
    .chg-neg { color: var(--negative); }
    @media (max-width: 640px) {
      .header-inner, .main { padding-left: 12px; padding-right: 12px; }
      .search-input { width: 160px; }
    }
    /* Chart Modal */
    #chart-modal { display: none; position: fixed; inset: 0; z-index: 100; }
    #chart-modal.open { display: flex; align-items: center; justify-content: center; }
    #sector-modal { display: none; position: fixed; inset: 0; z-index: 101; }
    #sector-modal.open { display: flex; align-items: center; justify-content: center; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
    .modal-content {
      position: relative; z-index: 1;
      width: 90vw; height: 80vh;
      border-radius: 12px; overflow: hidden;
      background: var(--bg-card); border: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .modal-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      background: var(--bg-muted); flex-shrink: 0;
    }
    #modal-name { font-weight: 700; font-size: 15px; color: var(--text); }
    .modal-title { display: flex; flex-direction: column; line-height: 1.25; }
    #modal-industry { font-size: 11px; color: var(--text-muted); font-weight: 400; }
    #modal-ticker { font-size: 12px; color: var(--text-muted); }
    .interval-btn {
      padding: 4px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border); background: var(--bg);
      color: var(--text-muted); transition: all 0.15s;
    }
    .interval-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .close-btn {
      margin-left: auto; width: 36px; height: 36px; border-radius: 6px; border: none;
      background: none; color: var(--text-muted); cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center; transition: background 0.15s;
    }
    .close-btn:hover { background: var(--hover); }
    #chart-panes { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 1px; background: var(--border); }
    #chart-main { flex: 5.75; min-height: 0; background: var(--bg-card); }
    .chart-sub { flex: 1.125; min-height: 60px; position: relative; background: var(--bg-card); }
    .chart-sub-label { position: absolute; top: 4px; left: 8px; font-size: 10px; font-weight: 700; color: var(--text-muted); z-index: 2; pointer-events: none; text-transform: uppercase; letter-spacing: 0.05em; }
    @media (max-width: 640px) {
      .modal-content { width: 100vw; height: 100vh; border-radius: 0; }
      .close-btn { width: 44px; height: 44px; }
    }
  </style>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
</head>
<body>
  <div id="app"></div>
  <div id="chart-modal">
    <div class="modal-backdrop" onclick="closeChart()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">
          <span id="modal-name"></span>
          <span id="modal-industry"></span>
        </div>
        <span id="modal-ticker"></span>
        <span id="modal-ds-legend" style="font-size:11px;color:var(--text-muted);margin-left:8px"></span>
        <button id="btn-daily" class="interval-btn active" onclick="switchInterval('D')">Daily</button>
        <button id="btn-weekly" class="interval-btn" onclick="switchInterval('W')">Weekly</button>
        <button class="close-btn" onclick="closeChart()">&#10005;</button>
      </div>
      <div id="chart-panes">
        <div id="chart-main"></div>
        <div id="chart-macd" class="chart-sub"><span class="chart-sub-label">MACD</span></div>
        <div id="chart-kdj" class="chart-sub"><span class="chart-sub-label">KDJ</span></div>
      </div>
    </div>
  </div>
  <div id="sector-modal">
    <div class="modal-backdrop" onclick="closeSector()"></div>
    <div class="modal-content" style="max-width:900px;height:auto;max-height:85vh;overflow:auto">
      <div class="modal-header">
        <span id="sector-title"></span>
        <button class="close-btn" onclick="closeSector()">&#10005;</button>
      </div>
      <div id="sector-content" style="padding:12px 16px"></div>
    </div>
  </div>
  <script>
  (function() {
    // ─── State ─────────────────────────────────────────
    let tabData = { date: '', tab1: { sos_section: [], pool_section: [] } };
    let trendData = null;   // 港股-趋势 (Part1-4), 来自 data/trend_hotspot_hk.json
    let usData = null;      // 海外-趋势 (Part1-5, US+JP), 来自 data/trend_hotspot_us.json
    let aData = null;       // A股-趋势 (Part1-4), 来自 data/trend_hotspot_a.json
    let etfData = null;     // 美国ETF-趋势, 来自 data/trend_hotspot_etf.json
    let cetfData = null;    // 中国ETF-趋势, 来自 data/trend_hotspot_cetf.json
    let mktBreadthData = null;  // 市场宽度(三市场V1+10格统计), 来自 data/market_breadth.json
    let indStageData = null;    // 行业Stage矩阵, 来自 data/industry_stage.json
    let search = '';
    let sortField = 'ma10_slope_pct';
    let sortDir = 'desc';
    let tab = 'market'; // 'market' | 'trend' | 'ustrend' | 'atrend' | 'entry'  (默认市场)
    let groupMode = true;
    let isDark = true;
    let copied = false;

    const TIER_ORDER = { 'STRONG': 0, 'STRONG NEW': 1, 'MID': 2, 'EARLY': 3, '': 4 };

    // ─── Data Loading ──────────────────────────────────
    let loadError = '';
    async function loadData() {
      try {
        const resp = await fetch('data/three_tabs_hk.json');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const text = await resp.text();
        tabData = JSON.parse(text);
      } catch(e) {
        loadError = e.message || String(e);
        tabData = { date: '', tab1: { sos_section: [], pool_section: [] } };
      }
      // 市场宽度 (三市场V1+10格统计): 失败不阻塞
      try {
        const rm = await fetch('data/market_breadth.json');
        if (rm.ok) mktBreadthData = JSON.parse(await rm.text());
      } catch(e) { mktBreadthData = null; }
      // 行业Stage矩阵: 失败不阻塞
      try {
        const ri = await fetch('data/industry_stage.json');
        if (ri.ok) indStageData = JSON.parse(await ri.text());
      } catch(e) { indStageData = null; }
      window.__indStageData = indStageData || window.__indStageData;   // 同步全局(图表弹窗用); 内嵌为fetch失败兜底
      // 港股-趋势 (Part1-4): 失败不阻塞原 tab
      try {
        const r2 = await fetch('data/trend_hotspot_hk.json');
        if (r2.ok) trendData = JSON.parse(await r2.text());
      } catch(e) { trendData = null; }
      window.trendData = trendData;   // 暴露给全局 showChart (图表切换用)
      // 海外-趋势 (Part1-5): 失败不阻塞
      try {
        const r3 = await fetch('data/trend_hotspot_us.json');
        if (r3.ok) usData = JSON.parse(await r3.text());
      } catch(e) { usData = null; }
      window.usData = usData;
      // A股-趋势 (Part1-4): 失败不阻塞
      try {
        const r4 = await fetch('data/trend_hotspot_a.json');
        if (r4.ok) aData = JSON.parse(await r4.text());
      } catch(e) { aData = null; }
      window.aData = aData;

    // ─── 行业tab: sector + sub-industry × 全子档胜率/赔率矩阵 (2026-10-19) ───
    function renderIndustry() {
      const _ind = indStageData || window.__indStageData;
      if (!_ind || !_ind.sectors) return '<div style="padding:40px;color:var(--text-muted)">行业数据未加载</div>';
      const SUBS = _ind.subs || ['4','4+','1','1+','2A','2B','2C','3','3-'];
      const fmtM = (v) => v >= 1000 ? (v/1000).toFixed(1) + 'B' : v + 'M';

      function stageCell(st, isCurrent) {
        if (!st || st.n < 3) return `<td style="padding:5px 10px;border:${isCurrent?'3px solid #f59e0b':'1px solid var(--border)'};text-align:center;color:var(--text-muted);font-size:13px">${isCurrent?'← 当前':''}</td>`;
        const bg = st.mean >= 4 && (st.r||0) >= 3 ? '#16a34a' : st.mean < 0 ? '#dc262655' : st.avgl == null && st.mean > 2 ? '#16a34a88' : '#22c55e22';
        const txt = st.mean >= 4 && (st.r||0) >= 3 ? '#fff' : 'var(--text)';
        const border = isCurrent ? '3px solid #f59e0b' : '1px solid var(--border)';
        const glow = isCurrent ? 'box-shadow:0 0 8px #f59e0b88;' : '';
        const curTag = isCurrent ? '<div style="font-size:11px;color:#f59e0b;font-weight:800">◀ 当前</div>' : '';
        return `<td style="padding:5px 10px;border:${border};background:${bg};text-align:center;min-width:92px;${glow}">
          ${curTag}
          <div style="font-weight:700;font-size:14px;color:${txt}">${st.mean>0?'+':''}${st.mean}% ${st.r!=null?'R'+st.r:''}</div>
          <div style="font-size:12px;color:${txt==='var(--text)'?'var(--text-muted)':'#ddd'}">胜${st.win}% n=${st.n}</div>
          <div style="font-size:11px;color:${txt==='var(--text)'?'var(--text-muted)':'#ddd'}">赢${st.avgw!=null?'+'+st.avgw+'%':'—'} 亏${st.avgl!=null?st.avgl+'%':(st.win===100?'无':'—')}</div>
        </td>`;
      }

      function industryTable(rows, showSector) {
        let h = '<table style="border-collapse:collapse;font-size:13px;margin:8px 0 20px"><tr><td style="padding:4px 10px;font-weight:700;color:var(--text-muted);font-size:13px">行业</td>';
        if (showSector) h += '<td style="padding:4px 8px;font-weight:700;color:var(--text-muted);font-size:12px">Sector</td>';
        h += '<td style="padding:4px 8px;font-weight:700;color:var(--text-muted);font-size:12px">规模</td><td style="padding:4px 8px;font-weight:700;color:var(--text-muted);font-size:12px">当前</td>';
        for (const s of SUBS) {
          const col = SUB_COLOR[s] || 'var(--text-muted)';
          h += `<td style="padding:4px 8px;font-weight:700;color:${col};text-align:center;font-size:14px">${s}</td>`;
        }
        h += '</tr>';
        let lastSec = '';
        for (const row of rows) {
          if (showSector && row.sector !== lastSec) {
            lastSec = row.sector;
            h += `<tr><td colspan="${SUBS.length + (showSector?4:3)}" style="padding:8px 10px;font-weight:700;font-size:16px;color:var(--text);border-bottom:2px solid var(--border);background:var(--bg-muted)">${row.sector}</td></tr>`;
          }
          h += `<tr><td style="padding:5px 12px;font-weight:600;white-space:nowrap;font-size:13px"><a class="tk-link" href="#" onclick="showIndustryChart('${row.name.replace(/'/g,'')}','${showSector?'sub_industry':'sector'}'); return false;">${row.name}</a></td>`;
          if (showSector) h += `<td style="padding:4px 8px;font-size:12px;color:var(--text-muted)">${row.sector}</td>`;
          h += `<td style="padding:4px 8px;font-size:12px;color:var(--text-muted)">${fmtM(row.size)}</td>`;
          h += `<td style="padding:4px 8px;font-size:12px;color:${SUB_COLOR[row.current.split('/')[1]]||'var(--text)'}">${row.current}</td>`;
          for (const s of SUBS) h += stageCell(row.stats[s], s === row.current.split('/')[1]);
          h += '</tr>';
        }
        h += '</table>';
        return h;

      // ── 汇总表: 全子档池化统计 ──
      const summary = _ind.sub_summary || {};

        const bg = st.mean >= 4 && (st.r||0) >= 3 ? '#16a34a' : st.mean < 0 ? '#dc262655' : st.avgl == null && st.mean > 2 ? '#16a34a88' : '#22c55e22';
        const txt = st.mean >= 4 && (st.r||0) >= 3 ? '#fff' : 'var(--text)';
        html += `<tr><td style="padding:5px 12px;font-weight:700;color:${SUB_COLOR[s]||'var(--text)'}">${s}</td>`;

        html += `<td style="padding:5px 12px;text-align:center;color:var(--positive)">+${st.avgw||'—'}%</td>`;
        html += `<td style="padding:5px 12px;text-align:center;color:var(--negative)">${st.avgl||'—'}%</td>`;
        html += `<td style="padding:5px 12px;text-align:center;font-weight:700">${st.r||'—'}</td></tr>`;

      // ── IC排名 (可折叠, 默认收起) ──
      const icr = _ind.ic_rank || [];

      function toTV(t) {

        if (t.endsWith('.JP')) return 'TSE:' + t.replace('.JP', '');
        if (t.endsWith('.SH')) return 'SSE:' + t.replace('.SH', '');
        if (t.endsWith('.SZ')) return 'SZSE:' + t.replace('.SZ', '');
        if (t.endsWith('.BJ')) return 'BSE:' + t.replace('.BJ', '');
        return t;
      }
      function downloadTVCSV() {
        const markets = [
          {data: trendData, name: 'HK'},
          {data: usData, name: 'US'},
          {data: etfData, name: 'US-ETF'},
          {data: cetfData, name: 'CN-ETF'},

        const seen = new Set(), rows = [];
        for (const m of markets) {
          if (!m.data) continue;
          const sections = [
            {key: 'bottom',  label: m.name + ' Bottom Watch'},
            {key: 'part1c1', label: m.name + ' First New High'},
            {key: 'part1c2', label: m.name + ' Sustained New High'},
          ];
          for (const sec of sections) {
            const tickers = (m.data[sec.key] || []).filter(r => r.ticker && !seen.has(r.ticker)).map(r => { seen.add(r.ticker); return toTV(r.ticker); });
            if (tickers.length) {
              rows.push('### ' + sec.label);
              rows.push(...tickers);
            }
          }
        }
        const csv = 'symbols\n' + rows.join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'tradingview_watchlist.csv';
        a.click();
        URL.revokeObjectURL(a.href);

    // ─── 港股-趋势 (Part1-4) 渲染 ──────────────────────
    const pctR  = v => v != null ? (v * 100).toFixed(1) + '%' : '-';        // 比值→%
    const pctRaw = v => v != null ? Number(v).toFixed(1) + '%' : '-';       // 已是%→%
    const signedR = v => v != null ? (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%' : '-';
    const num2 = v => v != null ? Number(v).toFixed(2) : '-';
    const pad4 = a => [...(a || []), null, null, null, null].slice(0, 4);
    const accelLv = (a, th) => {          // 0=无加速 1=加速(最新>上期) 2=连续加速(再上一期还在升)
      const p = pad4(a);
      if (p[0] == null || p[0] < th || p[1] == null || p[0] <= p[1]) return 0;
      return (p[2] != null && p[1] > p[2]) ? 2 : 1;
    };
    const yoyCell = (v, th, lv, mark) => {
      if (v == null) return '<span class="fund-td">-</span>';
      if (v < 0) return `<span class="yoy-neg fund-td">${Number(v).toFixed(1)}</span>`;
      const cls = v >= th ? (lv >= 2 ? 'yoy-g3' : lv === 1 ? 'yoy-g2' : 'yoy-g1') : 'fund-td';
      return `<span class="${cls} fund-td">+${Number(v).toFixed(1)}${mark && lv >= 1 ? '▲' : ''}</span>`;
    };
    const roeCell = v => v == null ? '<span class="fund-td">-</span>'
        : `<span class="${v >= 12 ? 'roe-g' : ''} fund-td">${Number(v).toFixed(1)}</span>`;
    const fundCells = e => {
      const sLv = accelLv(e.sales_yoy4, 20), pLv = accelLv(e.profit_yoy4, 30);
      const cell = (v, i) => i === 0 ? '§G§' + v : v;
      return [
        ...pad4(e.sales_yoy4).map((v, i) => cell(yoyCell(v, 20, sLv, i === 0), i)),
        ...pad4(e.profit_yoy4).map((v, i) => cell(yoyCell(v, 30, pLv, i === 0), i)),
        ...pad4(e.roe4).map((v, i) => cell(roeCell(v), i))];
    };
    const ser = a => (a || []).map(v => v == null ? '-' : (v >= 0 ? '+' : '') + Number(v).toFixed(1)).join('·') || '-';
    const per = a => (a || []).join('·');
    const yn = v => v ? '<span style="color:#22c55e">✓</span>' : '<span class="muted-val">·</span>';
    const ma10warn = v => v > 3 ? `<span style="color:#ef5350;font-weight:700">⚠${v}</span>` : v > 0 ? `<span style="color:#fb8c00">${v}</span>` : '<span class="muted-val">·</span>';

    function trendTable(headers, rows) {
      // headers 支持字符串 或 [label, colspan] 分组表头; colspan>1 的列其数据列按最小单元对齐
      const ths = headers.map(h => Array.isArray(h) ? `<th colspan="${h[1]}" class="grp-start">${h[0]}</th>` : `<th>${h}</th>`).join('');
      const nCols = headers.reduce((a, h) => a + (Array.isArray(h) ? h[1] : 1), 0);
      const trs = rows.length ? rows.map(r => `<tr>${r.map(c => typeof c === 'string' && c.startsWith('§G§')
        ? `<td class="grp-start">${c.slice(3)}</td>` : `<td>${c}</td>`).join('')}</tr>`).join('')
                               : `<tr><td colspan="${nCols}" class="empty-state"><p>暂无数据</p></td></tr>`;
      return `<div class="table-wrap"><div class="table-scroll"><table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div></div>`;
    }
    function trendSection(title, count, body, id) {
      return `<div class="section-divider"${id ? ` id="${id}"` : ''}>${title}<span class="section-count">${count}</span></div>${body}`;
    }
    // (gotoSection 定义在 IIFE 外全局区 — chip 的 onclick 属性是全局作用域解析)
    const chip = (label, cls, val, target) => target
      ? `<a href="#${target}" onclick="gotoSection('${target}');return false;" class="summary-item" style="text-decoration:none;cursor:pointer"><span class="state-badge ${cls}">${label}</span><span class="summary-val">${val}</span></a>`
      : `<div class="summary-item"><span class="state-badge ${cls}">${label}</span><span class="summary-val">${val}</span></div>`;
    function tk(t, screen) { return `<a class="tk-link" href="#" onclick="showChart('${t}'${screen ? `, '${screen}'` : ''}); return false;">${t}</a>`; }

    function renderTrendSummary() {
      const d = trendData;
      if (!d) return `<div class="summary-item"><span class="summary-val">趋势数据未加载</span></div>`;
      const all = d.all_stocks || [];
      const top = (d.part1 && d.part1.sub_industries && d.part1.sub_industries[0]) || {};
      const cnt = (fn) => all.filter(fn).length;
      const s1  = cnt(s => s.stage === '1');
      const s1p = cnt(s => s.sub === '1+');
      const s2a = cnt(s => s.sub === '2A');
      const s2o = cnt(s => s.stage === '2' && s.sub !== '2A');
      const s3  = cnt(s => s.stage === '3');
      const s4  = cnt(s => s.stage === '4');
      const s4p = cnt(s => s.sub === '4+');
      // Stage chip: 同字号, 白字彩底
      const stChip = (label, val, bg) =>
        `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:6px;
           background:${bg};color:#fff;font-size:13px;font-weight:700;white-space:nowrap">
           ${label} <span style="font-size:13px;font-variant-numeric:tabular-nums">${val}</span></span>`;
      // 信息 chip: 白字彩底
      const infoChip = (label, val, bg, target) => target
        ? `<a href="#" onclick="document.getElementById('${target}').scrollIntoView({behavior:'smooth'});return false;"
             style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:6px;
             background:${bg};color:#fff;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap">
             ${label} <b>${val}</b></a>`
        : `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:6px;
             background:${bg};color:#fff;font-size:12px;font-weight:600;white-space:nowrap">
             ${label} <b>${val}</b></span>`;
      // 第一行: Stage 计数
      const row1 = `<div style="display:flex;flex-wrap:wrap;gap:6px;padding:2px 0">
        ${stChip('S1', s1, '#b45309')}
        ${stChip('1+', s1p, '#15803d')}
        ${stChip('2A', s2a, '#16a34a')}
        ${stChip('S2≠A', s2o, '#4d7c0f')}
        ${stChip('S3', s3, '#c2410c')}
        ${stChip('S4', s4, '#b91c1c')}
        ${stChip('4+', s4p, '#c2410c')}
      </div>`;
      // 第二行: 其他信息
      const row2 = `<div style="display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px">
        ${infoChip('最热细分', `${d.hottest_sub || '-'}${top.composite != null ? ' (' + top.composite + ')' : ''}`, '#1d4ed8', 'sec-p1')}
        ${infoChip('SOS异动', (d.part3 || []).length, '#6d28d9', 'sec-sos')}
        ${infoChip('东吴B', dsBFilter(d.ds_b).length, '#0e7490', 'sec-bottom')}
        ${infoChip('首次新高', (d.part1c1 || []).length, '#0e7490', 'sec-nh1')}
        ${infoChip('持续新高', (d.part1c2 || []).length, '#0e7490', 'sec-nh2')}
      </div>`;
      return row1 + row2;
    }

    function renderTrend() {
      const d = trendData;
      if (!d) return `<div class="empty-state"><p>趋势数据未加载 (public/data/trend_hotspot_hk.json)</p></div>`;
      let html = `<div class="subtitle" style="padding:4px 0 10px">港股趋势四部曲 · ${d.date || ''}　最热细分行业：${d.hottest_sub || '-'}</div>`;

      // ── Part 1: 行业热度 (仅显示 60日涨幅>10% 的强势行业) ──
      // ── Part 1a: 子行业预期收益排名 (当前子档历史表现, 取前15, 均值>2%或R>3) ──
      const _ind1 = (window.indStageData || window.__indStageData || (typeof indStageData !== 'undefined' ? indStageData : null)) || (window.__indStageData || {});
      const _subList = _ind1.sub_industries || [];
      const _subRanked = [];
      for (const x of _subList) {
        const cur = x.current.includes('/') ? x.current.split('/')[1] : '';
        const st = (x.stats || {})[cur];
        if (!st || st.n < 3) continue;
        if ((st.mean || 0) > 2 || (st.r || 0) > 3) {
          _subRanked.push({name: x.name, sector: x.sector, sub: cur, mean: st.mean, r: st.r, win: st.win, n: st.n, current: x.current, size: x.size});
        }
      }
      _subRanked.sort((a, b) => (b.mean || 0) - (a.mean || 0));
      const top15 = _subRanked.slice(0, 15);
      if (top15.length) {
        const p1aRows = top15.map((e, i) => [
          String(i + 1),
          `<a class="tk-link" href="#" onclick="showSubIndustry('${e.name}','hk'); return false;">${e.name}</a>`,
          e.sector || '-',
          `<b style="color:${SUB_COLOR[e.sub] || 'var(--text)'}">${e.current}</b>`,
          `<b style="font-size:14px;color:${e.mean >= 4 ? '#16a34a' : e.mean > 0 ? '#22c55e' : '#dc2626'}">${e.mean > 0 ? '+' : ''}${e.mean}%</b>`,
          e.r != null ? `<b>R${e.r}</b>` : '-',
          e.win != null ? e.win + '%' : '-',
          e.n]);
        html += trendSection('Part 1a · 子行业预期收益排名 (当前Stage的历史平均收益, 前15, 筛选: 均值>2%或R>3)',
          top15.length,
          trendTable(['#','子行业','Sector','当前','预期收益','R','胜率','n'], p1aRows), 'sec-p1');
      }

      const secs = (d.part1 && d.part1.sectors || []);
      // Part 1b: 按Sector预期收益排序
      const _secList = _ind1.sectors || [];
      const _secRanked = [];
      for (const x of _secList) {
        const cur = x.current.includes('/') ? x.current.split('/')[1] : '';
        const st = (x.stats || {})[cur];
        _secRanked.push({name: x.name, current: x.current, sub: cur,
          mean: st ? st.mean : null, r: st ? st.r : null, win: st ? st.win : null, n: st ? st.n : null,
          size: x.size});
      }
      _secRanked.sort((a, b) => ((b.mean != null ? b.mean : -999) - (a.mean != null ? a.mean : -999)));
      const secRows = _secRanked.map((x, i) => [
        String(i + 1),
        `<a class="tk-link" href="#" onclick="showSector('${x.name}'); return false;">${x.name}</a>`,
        `<b style="color:${SUB_COLOR[x.sub] || 'var(--text)'}">${x.current}</b>`,
        x.mean != null ? `<b style="color:${x.mean >= 4 ? '#16a34a' : x.mean > 0 ? '#22c55e' : '#dc2626'}">${x.mean > 0 ? '+' : ''}${x.mean}%</b>` : '—',
        x.r != null ? `R${x.r}` : '-',
        x.win != null ? x.win + '%' : '-',
        x.n != null ? x.n : '-']);
      html += trendSection('Part 1b · GICS Sector 预期收益排名 (按当前Stage历史平均收益降序)',
        _secRanked.length,
        trendTable(['#','Sector','当前','预期收益','R','胜率','n'], secRows));

      // ── 6月新高 (首次/持续) ──
      const p1cCols = ['代码','名称','细分行业','收盘','距250高','6月新高','250日新高','6月新高占比','量放','5日均额排','60日涨幅',['营收YoY % (新→旧)', 4],['净利YoY % (新→旧)', 4],['ROE % (新→旧)', 4],'MA10','热度分'];
      const p1cRow = (e, sc) => [
        tk(e.ticker, sc), e.name, e.sub_industry, num2(e.close), pctR(e.pct_high_250),
        yn(e.pct_high_126 >= 1.0), yn(e.pct_high_250 >= 1.0), pctR(e.nh_ratio_126),
        num2(e.amt_surge) + 'x', num2(e.amt_rank), signedR(e.ret_60), ...fundCells(e), ma10warn(e.days_below_ma10), `<b>${num2(e.hotness)}</b>`];
      // ── Part 2: SOS 异动个股 (Wyckoff Sign of Strength: 放量中大阳+RS超额, 无位置门, 全量显示) ──
      html += lifecyclePart(d);
      const p3 = d.part3 || [];
      const isSosToday = t => t === 'SOS' || t === 'SOS+3日';
      const sosToday = p3.filter(e => isSosToday(e.trigger));
      const sos3d = p3.filter(e => !isSosToday(e.trigger));
      const trigBadge = t => t === 'SOS+3日' ? '<span class="chg-badge chg-pos">SOS+3日</span>'
                            : t === 'SOS 3日' ? '<span class="chg-badge" style="background:#a855f7;color:#fff">SOS 3日</span>'
                            : '<span class="chg-badge chg-pos">SOS</span>';
      const p3Rows = arr => arr.map(e => [
        tk(e.ticker, 'part3'), e.name, e.sub_industry, num2(e.close),
        e.ret_1d != null ? `<span class="chg-pos">+${e.ret_1d}%</span>` : '-',
        e.ret_3d != null ? `<span class="chg-pos">+${e.ret_3d}%</span>` : '-',
        num2(e.vol_ratio) + 'x', trigBadge(e.trigger), num2(e.hotness), ...fundCells(e)]);
      html += trendSection('Part 2 · SOS 当日 (最新一根, Wyckoff Sign of Strength: 放量中大阳+RS超额, 无位置门)', sosToday.length,
        trendTable(['代码','名称','细分行业','收盘','当日涨幅','3日涨幅','量比','触发','热度分',['营收YoY % (新→旧)', 4],['净利YoY % (新→旧)', 4],['ROE % (新→旧)', 4]], p3Rows(sosToday)), 'sec-sos');
      html += trendSection('Part 2b · SOS 3日内 (最新根之前的3根内触发+3日确认, 全量)', sos3d.length,
        trendTable(['代码','名称','细分行业','收盘','当日涨幅','3日涨幅','量比','触发','热度分',['营收YoY % (新→旧)', 4],['净利YoY % (新→旧)', 4],['ROE % (新→旧)', 4]], p3Rows(sos3d)), 'sec-sos3');

      // ── Part 3: 最热个股 top30 ──
      // ── Part 4: 回调买点 ──
      html += transPart(d, 't12', 'Part 2c · 1→2 转换 (近10个交易日刚进入Stage 2, 进场关注; 最新在前)', 'var(--positive)');
      html += transPart(d, 't34', 'Part 2d · 3→4 转换 (近10个交易日跌破进入Stage 4, 离场/回避; 最新在前)', 'var(--negative)');
      // ── Part 3 (合并原3.1+3.2): 底部区 (东吴S信号已于2026-10-13全部tab移除) ──
      html += bottomPart(d, 'trend', ['代码','名称','细分行业','收盘','周J(8周低)','位置250','背离','跌不动','买点','分',['营收YoY % (新→旧)', 4],['净利YoY % (新→旧)', 4],['ROE % (新→旧)', 4]]);

      const p1c1 = d.part1c1 || [];
      html += trendSection('Part 5-1 · 首次新高 (6月新高≤2% OR 3月新高=最高, 首次天数<4%, hotness 排序, ≤20)', p1c1.length,
        trendTable(p1cCols, p1c1.map(e => p1cRow(e, 'part1c1'))), 'sec-nh1');
      const p1c2 = d.part1c2 || [];
      html += trendSection('Part 5-2 · 持续新高 (6月新高, 近6月新高天数≥4%, hotness 排序, ≤30)', p1c2.length,
        trendTable(p1cCols, p1c2.map(e => p1cRow(e, 'part1c2'))), 'sec-nh2');

      return html;
    }

    // ─── 海外-趋势 (Part1-5) 渲染 (复用 renderTrend 的 helper, 字段名同HK: sub_industry=Industry) ──

    // ─── 东吴风险趋势信号 ───
    function dsSigBadge(sig) {
      if (!sig) return '<span style="color:var(--text-2)">-</span>';
      const map = {B:['#dc2626','B 底右·强买'], b:['#f87171','b 底左·早买'], S:['#16a34a','S 顶右·强卖'], s:['#4ade80','s 顶左·早卖']};
      const first = map[sig[0]] || ['var(--text-2)', sig];
      return `<b style="color:${first[0]}" title="${first[1]}">${sig}</b>`;
    }
    function dsTRColor(tr) {
      if (tr == null || tr === '') return '-';
      const v = Number(tr);
      const c = v < 20 ? '#16a34a' : v < 50 ? '#65a30d' : v <= 85 ? 'var(--text)' : '#dc2626';
      return `<b style="color:${c}">${v}</b>`;
    }
    // ─── 东吴B信号 section (Part 3.2, 数据在各 trend_hotspot_*.json 的 ds_b; 东吴S已于2026-10-13全部tab移除) ───
    function dsRow(e, screen) {
      return [
        tk(e.ticker, screen), e.name || '', e.sub_industry || '-', num2(e.close),
        `<b>${e.days}</b>`, dsSigBadge(e.sig), dsTRColor(e.tr),
        (e.mom != null && e.mom !== '') ? e.mom : '-',
        e.panic ? '<b style="color:#dc2626">✓</b>' : '-', e.weekly || '-'];
    }
    function dsRows(arr, screen) { return (arr || []).map(e => dsRow(e, screen)); }
    // 只保留当日有 B/b 信号的 (sig='' = 仅历史窗口内出现过, 不再显示)
    const dsBFilter = arr => (arr || []).filter(e => e.sig === 'B' || e.sig === 'b');
    // 最新一期营收YoY: 增速排序键 (无基本面排尾)
    const growVal = e => { const a = e.sales_yoy4; return (Array.isArray(a) && a.length && a[0] != null && a[0] !== '') ? Number(a[0]) : -Infinity; };
    const growCell = e => { const v = growVal(e); return v === -Infinity ? '-' : signedR(v); };
    const DS_B_COLS_B = ['代码','名称','行业','收盘','B距今(天)','当日信号','风险度','动量','急杀','周线档','营收YoY'];
    const DS_B_COLS = ['代码','名称','行业','收盘','B距今(天)','当日信号','风险度','动量','急杀','周线档'];
    function dsBPart(d, partBLabel) {
      const b = dsBFilter(d.ds_b).slice().sort((x, y) => (x.sig === y.sig ? growVal(y) - growVal(x) : (x.sig === 'B' ? -1 : 1)));
      return trendSection(`${partBLabel} · 东吴B信号 (仅当日 B/b 信号: B=底右强买/b=底左早买, 按营收增速降序; 急杀=恐慌宣泄型底部, A/美股胜率+4pp)`, b.length,
        trendTable(DS_B_COLS_B, b.map(e => [...dsRow(e, 'ds_b'), growCell(e)])), 'sec-dsb');
    }
    // ── 生命周期 · 市场档位驱动版 (2026-10-18重构): Top3子档×板块V1分组 ──
    function lifecyclePart(d) {
      const all = d.all_stocks || [];
      const top3 = d.top3_subs || ['1+','2A','2B'];
      const mktBkt = d.mkt_bucket || '';
      const mktCell = d.mkt_cell || '';
      if (!all.length) return '';
      // 翻页导航: 按显示顺序(板块V1→SATA)存每个子档的完整列表
      window.__lcNavOrder = {};
      for (const sub of top3) {
        const pool = all.filter(s => s.sub === sub);
        // 复制排序逻辑: 按板块V1分组→组内SATA→热度
        pool.sort((a, b) => ((b.sector_v1 || 0) - (a.sector_v1 || 0))
          || (b.sata_w || 0) - (a.sata_w || 0)
          || (b.hotness || 0) - (a.hotness || 0));
        window.__lcNavOrder[sub] = pool.map(st => st.ticker);
      }
      let h = `<div style="padding:4px 0 2px;font-size:12px;color:var(--text-muted)">
        市场档位: <b style="color:#f59e0b">${mktBkt}</b> (${mktCell}) → 按该档位历史最优子档选股 · 板块按V1降序 · 组内按SATA周→热度降序</div>`;
      for (const sub of top3) {
        // 筛选当前处于该子档的票
        const pool = all.filter(s => s.sub === sub);
        if (!pool.length) continue;
        // 扁平化: 板块V1降序 → 组内SATA→热度, 不再分组显示, 板块放最后一列
        pool.sort((a, b) => ((b.sector_v1 || 0) - (a.sector_v1 || 0))
          || (b.sata_w || 0) - (a.sata_w || 0)
          || (b.hotness || 0) - (a.hotness || 0));

        const secId = 'lc-' + sub.replace(/[^a-zA-Z0-9]/g, '');

          <div style="display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none" onclick="const el=document.getElementById('${secId}');const b=el.style.display!=='none';el.style.display=b?'none':'';this.querySelector('.arrow').textContent=b?'▶':'▼'">
            <span class="arrow" style="font-size:11px;color:var(--text-muted)">▼</span>
            <span style="font-size:15px;font-weight:800;color:${SUB_COLOR[sub] || 'var(--text)'}">${sub}</span>
            <span style="font-size:12px;color:var(--text-muted)">(${pool.length}只 · ${mktBkt}档历史最优)</span>
          </div>
          <div id="${secId}" style="padding:4px 0 8px">
          ${trendTable(['代码','名称','收盘','SATA周','热度分','子档标记','持续','行业(V1)'],
            pool.map(s => [
              tk(s.ticker, 'lifecycle'), s.name,
              num2(s.close), sataCell(s.sata_w), `<b>${num2(s.hotness)}</b>`,
              (s.marks || []).join('·') || '-',
              s.stage_days != null ? s.stage_days + 'd' : '-',
              `<span style="font-size:11px">${s.sector || '-'} <span style="color:#6366f1">${s.sector_v1 != null ? (s.sector_v1 * 100).toFixed(0) + '%' : ''}</span></span>`
            ]))}
          </div>
        </div>`;
      }
return h;
    }

    // ── Part 2c/2d: 阶段转换 (1→2=刚进入Stage2进场关注 / 3→4=跌破进入Stage4离场回避; 近10交易日, 最新在前) ──
    // (fundLv/yoyLvCell/roeLvCell 定义在 IIFE 外全局区 — showChart 也要用, 见下)

    function bottomPart(d, screen, btCols) {

  function calcMA(data, period) {   // EMA: 首值=SMA种子, 之后指数平滑 (2026-09-06 SMA→EMA)
    const out = [];
    let ema = null;
    const k = 2 / (period + 1);
    for (let i = period - 1; i < data.length; i++) {
      if (ema === null) {
        let sum = 0;
        for (let j = i - period + 1; j <= i; j++) sum += data[j][4];
        ema = sum / period;
      } else {
        ema = data[i][4] * k + ema * (1 - k);
      }
      out.push({ time: data[i][0], value: +ema.toFixed(2) });
    }
    return out;
  }

  function calcVolMA(data, period) {  // EMA: 首值=SMA种子 (与价格均线一致改EMA)
    const out = [];
    let ema = null;
    const k = 2 / (period + 1);
    for (let i = period - 1; i < data.length; i++) {
      if (ema === null) {
        let sum = 0;
        for (let j = i - period + 1; j <= i; j++) sum += data[j][5];
        ema = sum / period;
      } else {
        ema = data[i][5] * k + ema * (1 - k);
      }
      out.push({ time: data[i][0], value: +ema.toFixed(0) });
    }
    return out;
  }

  function _ema(values, period) {
    const out = new Array(values.length).fill(null);
    let start = 0;
    while (start < values.length && values[start] === null) start++;   // 跳过前导 null (如 dif)
    if (start + period > values.length) return out;
    let sum = 0;
    for (let i = start; i < start + period; i++) sum += values[i];
    let e = sum / period;
    out[start + period - 1] = e;
    const k = 2 / (period + 1);
    for (let i = start + period; i < values.length; i++) {
      if (values[i] === null) break;
      e = values[i] * k + e * (1 - k);
      out[i] = e;
    }
    return out;
  }

  function calcMACD(data, fast, slow, signal) {
    fast = fast || 12; slow = slow || 26; signal = signal || 9;
    const c = data.map(d => d[4]), t = data.map(d => d[0]);
    const ef = _ema(c, fast), es = _ema(c, slow);
    const dif = c.map((_, i) => (ef[i] !== null && es[i] !== null) ? ef[i] - es[i] : null);
    const dea = _ema(dif, signal);
    const difD = [], deaD = [], histD = [];
    for (let i = 0; i < c.length; i++) {
      const time = t[i];
      if (dif[i] === null) { difD.push({ time }); }              // whitespace 补齐 → 与主图同时间戳范围
      else difD.push({ time, value: +dif[i].toFixed(4) });
      if (dea[i] === null) { deaD.push({ time }); histD.push({ time }); }
      else {
        deaD.push({ time, value: +dea[i].toFixed(4) });
        const h = 2 * (dif[i] - dea[i]);
        histD.push({ time, value: +h.toFixed(4), color: h >= 0 ? 'rgba(38,166,154,0.7)' : 'rgba(239,83,80,0.7)' });
      }
    }
    return { dif: difD, dea: deaD, hist: histD };
  }

  function calcKDJ(data, n, kn, dn) {
    n = n || 9; kn = kn || 3; dn = dn || 3;
    const kD = [], dD = [], jD = [];
    let pk = 50, pd = 50;
    for (let i = 0; i < data.length; i++) {
      const t = data[i][0];
      if (i < n - 1) { kD.push({ time: t }); dD.push({ time: t }); jD.push({ time: t }); continue; }  // whitespace 补齐
      let hi = -Infinity, lo = Infinity;
      for (let j = i - n + 1; j <= i; j++) { hi = Math.max(hi, data[j][2]); lo = Math.min(lo, data[j][3]); }
      const rsv = hi === lo ? 50 : (data[i][4] - lo) / (hi - lo) * 100;
      const k = (2 / kn) * pk + (1 / kn) * rsv;
      const d = (2 / dn) * pd + (1 / dn) * k;
      const j = 3 * k - 2 * d;
      pk = k; pd = d;
      kD.push({ time: t, value: +k.toFixed(2) });
      dD.push({ time: t, value: +d.toFixed(2) });
      jD.push({ time: t, value: +j.toFixed(2) });
    }
    return { k: kD, d: dD, j: jD };
  }

    const theme = _lcTheme();
    _charts = [];

    // 均线(EMA): 5/10/20/30/40/50/60/70; 高亮 EMA5(橙)/EMA10(红)/EMA50(蓝) 不透明加粗, 其余淡灰背景
    const ma5  = calcMA(rows, 5),  ma10 = calcMA(rows, 10), ma20 = calcMA(rows, 20), ma30 = calcMA(rows, 30);
    const ma40 = calcMA(rows, 40), ma50 = calcMA(rows, 50), ma60 = calcMA(rows, 60), ma70 = calcMA(rows, 70);
    const macd = calcMACD(rows);
    const kdj = calcKDJ(rows);

    const candles = rows.map(r => ({ time: r[0], open: r[1], high: r[2], low: r[3], close: r[4] }));
    const vols = rows.map(r => ({
      time: r[0], value: r[5],
      color: r[4] >= r[1] ? 'rgba(38,166,154,0.4)' : 'rgba(239,83,80,0.4)',
    }));

    function mkChart(el) {
      const rect = el.getBoundingClientRect();
      return LightweightCharts.createChart(el, {
        ...theme,
        width: rect.width || el.clientWidth || 600,
        height: rect.height || el.clientHeight || 150,
        autosize: true,
      });
    }

    const allSeries = [];
    const addSer = (chart, opts, data) => { const s = chart.addLineSeries ? chart.addLineSeries(opts) : chart.addHistogramSeries(opts); s.setData(data); allSeries.push(s); return s; };

    const mainChart = mkChart(document.getElementById('chart-main'));
    const cs = mainChart.addCandlestickSeries({
      upColor: 'rgba(0,0,0,0)', downColor: '#ef5350',
      borderUpColor: '#26a69a', borderDownColor: '#ef5350',
      wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    });
    cs.setData(candles); allSeries.push(cs);

    // 东吴B/S信号标记 (仅日线; ds=[[ts,sig],...] 由chartdata导出, ts与daily行同口径)
    if (_chartInterval !== 'W' && Array.isArray(_chartData.ds) && _chartData.ds.length) {
      try {
        const tset = new Set(rows.map(r => r[0]));
        const mk = [];
        for (const ent of _chartData.ds) {
          if (!tset.has(ent[0])) continue;
          const sig = String(ent[1]), buy = sig.includes('B') || sig.includes('b');
          const color = sig.includes('B') ? '#dc2626' : sig.includes('b') ? '#f87171'
                      : sig.includes('S') ? '#16a34a' : '#4ade80';
          mk.push({ time: ent[0], position: buy ? 'belowBar' : 'aboveBar', color,
                    shape: buy ? 'arrowUp' : 'arrowDown', text: sig,
                    size: (sig === 'B' || sig === 'S') ? 2 : 1 });
        }
        if (mk.length) {
          if (LightweightCharts.createSeriesMarkers) LightweightCharts.createSeriesMarkers(cs, mk);
          else if (cs.setMarkers) cs.setMarkers(mk);
        }
      } catch (e) {}
    }

    const maOpts = (color, width) => ({ color, lineWidth: width || 1, priceLineVisible: false, lastValueVisible: false });
    // 高亮 EMA5(橙)/EMA10(红)/EMA50(蓝) — 不透明; 其余 EMA20/30/40/60/70 淡灰细线作背景
    [['#FB8C00', ma5, 1.5], ['#E53935', ma10, 1.5], ['rgba(150,150,150,0.4)', ma20, 1], ['rgba(150,150,150,0.4)', ma30, 1],
     ['rgba(150,150,150,0.4)', ma40, 1], ['#42A5F5', ma50, 1.5], ['rgba(150,150,150,0.4)', ma60, 1], ['rgba(150,150,150,0.4)', ma70, 1]]
      .forEach(([c, arr, w]) => { if (arr.length) addSer(mainChart, maOpts(c, w), arr); });

    if (_chartScreen !== 'industry-chart') {
      const vs = mainChart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol' });
      vs.setData(vols); allSeries.push(vs);
      mainChart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
      const volMA30 = calcVolMA(rows, 30);
      if (volMA30.length) addSer(mainChart, { color: '#FFEB3B', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, priceScaleId: 'vol' }, volMA30);
    }

    _charts.push(mainChart);

    const macdChart = mkChart(document.getElementById('chart-macd'));
    if (macd.hist.length) { const s = macdChart.addHistogramSeries({ priceFormat: { type: 'price', precision: 3 } }); s.setData(macd.hist); allSeries.push(s); }
    if (macd.dif.length) addSer(macdChart, { color: '#2196F3', lineWidth: 1, priceLineVisible: false, lastValueVisible: false }, macd.dif);
    if (macd.dea.length) addSer(macdChart, { color: '#FF6B6B', lineWidth: 1, priceLineVisible: false, lastValueVisible: false }, macd.dea);
    _charts.push(macdChart);

    const kdjChart = mkChart(document.getElementById('chart-kdj'));
    let kdjSer = null;
    [['#2196F3', kdj.k], ['#FF6B6B', kdj.d], ['#9C27B0', kdj.j]]
      .forEach(([c, arr], i) => { if (arr.length) { const s = addSer(kdjChart, { color: c, lineWidth: 1, priceLineVisible: false, lastValueVisible: false }, arr); if (i === 0) kdjSer = s; } });
    _charts.push(kdjChart);
    // KDJ 超买(90)/超卖(10) 参考线
    if (kdjSer) {
      try {
        kdjSer.createPriceLine({ price: 90, color: 'rgba(160,160,160,0.55)', lineStyle: 2, lineWidth: 1, title: '', axisLabelVisible: false });
        kdjSer.createPriceLine({ price: 10, color: 'rgba(160,160,160,0.55)', lineStyle: 2, lineWidth: 1, title: '', axisLabelVisible: false });
      } catch (e) {}
    }

    // 强制关闭所有 series 的 price line (最后值横线) + 透明, v4.1.3 创建时设置未必生效
    allSeries.forEach(s => { try { s.applyOptions({ priceLineVisible: false, lastValueVisible: false, priceLineColor: 'rgba(0,0,0,0)' }); } catch (e) {} });

    // 显式关闭网格横线/竖线 + 右轴/时间轴边框 (白线来源)
    [mainChart, macdChart, kdjChart].forEach(c => {
      try {
        c.applyOptions({
          grid: { vertLines: { visible: false, color: 'rgba(0,0,0,0)' }, horzLines: { visible: false, color: 'rgba(0,0,0,0)' } },
          rightPriceScale: { borderVisible: false, ticksVisible: false },
          timeScale: { borderVisible: false },
        });
      } catch (e) {}
    });
    // 只保留主图(K线)x轴日期, MACD/KDJ 隐藏 x 轴 (timeScale 仍在, 不影响对齐同步)
    [macdChart, kdjChart].forEach(c => { try { c.applyOptions({ timeScale: { visible: false } }); } catch (e) {} });

    _syncScales(mainChart, macdChart, kdjChart);
    // 统一 rightOffset (留右侧空间) + 主图 fitContent, 子图同步同 range (同宽→同 barSpacing→对齐)
    [mainChart, macdChart, kdjChart].forEach(c => c.timeScale().applyOptions({ rightOffset: 6 }));
    // 日线只看最近10个月(~210根); 周线 fitContent (不变)
    if (_chartInterval === 'D' && (_chartData.daily || []).length > 210) {
      const n = _chartData.daily.length;
      mainChart.timeScale().setVisibleLogicalRange({ from: n - 210, to: n - 1 });
    } else {
      mainChart.timeScale().fitContent();
    }
    const mainRange = mainChart.timeScale().getVisibleLogicalRange();
    if (mainRange) {
      macdChart.timeScale().setVisibleLogicalRange(mainRange);
      kdjChart.timeScale().setVisibleLogicalRange(mainRange);
    }
  }

  function _syncScales(main, ...subs) {
    let syncing = false;
    const set = (src) => (range) => {
      if (syncing || !range) return;
      syncing = true;
      [main, ...subs].filter(c => c !== src).forEach(c => { try { c.timeScale().setVisibleLogicalRange(range); } catch(e){} });
      syncing = false;
    };
    main.timeScale().subscribeVisibleLogicalRangeChange(set(main));
    subs.forEach(s => s.timeScale().subscribeVisibleLogicalRangeChange(set(s)));
  }

  function openStockFromDetail(ticker) {
    closeSector();                                    // 关闭成分股表, 只显个股图
    showChart(ticker, null, _detailStockList);        // 图的方向键在该子行业成分股内切换
  }
  function stockName(ticker) {
    // 从已加载的各市场数据 + 进场候选 查个股名称 (图表左上角显示用)
    for (const d of [window.trendData, window.usData, window.etfData, window.cetfData, window.aData]) {
      if (!d) continue;
      for (const k of ['all_stocks', 'part1c1', 'part1c2', 'part2', 'part3', 'part4']) {
        const arr = d[k];
        if (Array.isArray(arr)) {
          const m = arr.find(e => e && e.ticker === ticker);
          if (m && (m.name || m.name_cn)) return m.name || m.name_cn;
        }
      }
    }
    const t1 = (window.tabData && window.tabData.tab1) || {};
    for (const k of ['sos_section', 'pool_section']) {
      const arr = t1[k];
      if (Array.isArray(arr)) {
        const m = arr.find(e => e && e.ticker === ticker);
        if (m && (m.name_cn || m.name)) return m.name_cn || m.name;
      }
    }
    return '';
  }
  function stockIndustry(ticker) {
    // 从已加载各市场数据查个股行业 (图表名称下方显示用)
    for (const d of [window.trendData, window.usData, window.etfData, window.cetfData, window.aData]) {
      if (!d) continue;
      for (const k of ['all_stocks', 'part1c1', 'part1c2', 'part2', 'part3', 'part4']) {
        const arr = d[k];
        if (Array.isArray(arr)) {
          const m = arr.find(e => e && e.ticker === ticker);
          if (m && (m.sub_industry || m.sector)) return [m.sub_industry, m.sector].filter(Boolean).join(' · ');
        }
      }
    }
    return '';
  }
  // SATA 技术属性评分单元格 (0-10; ≥6绿=趋势健康, 复刻工作侧SATA_AHADR算法, 2026-10-13)
  const sataCell = v => v == null ? '<span class="muted-val">-</span>'
    : `<b style="color:${v >= 6 ? 'var(--positive)' : v >= 4 ? 'var(--text)' : 'var(--text-muted)'}">${v}</b>`;
  // Weinstein 大阶段 + 1→2/3→4 转换单元格 (2026-10-13; 转换触发后≤10交易日追溯显示 "Nd")
  const stageCell = s => s == null ? '<span class="muted-val">-</span>'
    : `<b style="color:${s === '2' ? 'var(--positive)' : s === '4' ? 'var(--negative)' : 'var(--text)'}">${s}</b>`;
  const transCell = (d, col) => (d != null && d <= 10)
    ? `<b style="color:${col}">${d}d</b>` : '<span class="muted-val">·</span>';
  // 子档配色 (2026-10-18 用户定): 1+/2A/2B=绿(买侧), 3-/4=红(卖侧), 4+=橙(止跌), 3=黄(顶), 2C=橄榄(衰竭)
  const SUB_COLOR = { '4+':'#ff7043','1':'#9e9e9e','1+':'#16a34a',
    '2A':'#16a34a','2B':'#15803d','2C':'#65a30d','3':'#f9a825','3-':'#dc2626',
    '4':'#b91c1c','NA':'#64748b' };
  // 降级层新股角标: 上市151-252根, MA排列+上市以来位置的弱规则档位 (引擎v2.2, 2026-10-16)
  const provBadge = s => (s && s.prov) ? '<sup style="color:#f59e0b;font-size:9px;font-weight:700">新</sup>' : '';
  const t12Count = d => (d.all_stocks || []).filter(s => s.t12 != null && s.t12 <= 10).length;
  const t34Count = d => (d.all_stocks || []).filter(s => s.t34 != null && s.t34 <= 10).length;
  function stockSATA(ticker) {
    // 从已加载各市场 all_stocks 查个股 SATA 日/周分 (图表弹窗显示用)
    for (const d of [window.trendData, window.usData, window.etfData, window.cetfData, window.aData]) {
      if (!d || !Array.isArray(d.all_stocks)) continue;
      const m = d.all_stocks.find(e => e && e.ticker === ticker);
      if (m && (m.sata_d != null || m.sata_w != null)) return m;
    }
    return null;
  }
  // ── 全局区 helper (IIFE外): showChart 与 onclick 属性都在全局作用域解析 —
  //    定义放 IIFE 内会 ReferenceError (2026-10-14 修复: 图表空白/chip无反应的根因) ──
  function gotoSection(id) {   // 汇总chip点击 → 平滑滚动到对应section
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  const fundLv = a => (Array.isArray(a) && a.length && a[0] != null && a[0] !== '') ? Number(a[0]) : null;
  const yoyLvCell = v => v == null ? '<span class="muted-val">-</span>'
    : `<b style="color:${v >= 0 ? 'var(--positive)' : 'var(--negative)'}">${v >= 0 ? '+' : ''}${v.toFixed(1)}%</b>`;
  const roeLvCell = v => v == null ? '<span class="muted-val">-</span>' : `<b>${v.toFixed(1)}%</b>`;

  async function showChart(ticker, screen, list) {
    _chartTicker = ticker;
    // _chartInterval 不重置: 首次默认 D(模块初值), 切换 W 后下次打开保持 W
    _chartData = null;
    _chartScreen = screen || null;
    const mkt = ticker.endsWith('.US') || ticker.endsWith('.JP') ? 'us'   // 日股图数据也在 chartdata/us/ (文件名保留.JP)
              : (/\.S[HZ]$|\.BJ$/.test(ticker) ? 'a' : 'hk');
    // .US 的 ticker 可能是 ETF (在 etfData 里) 或股票; ETF 用 etfData 做导航列表源
    const _inEtf = mkt === 'us' && window.etfData && ['all_stocks','part1c1','part1c2','part2']
      .some(k => Array.isArray(etfData[k]) && etfData[k].some(e => e && e.ticker === ticker));
    // .SH/.SZ 的 ticker 可能是中国ETF (在 cetfData 里) 或A股; 中国ETF 用 cetfData
    const _inCetf = mkt === 'a' && window.cetfData && ['all_stocks','part1c1','part1c2','part2']
      .some(k => Array.isArray(cetfData[k]) && cetfData[k].some(e => e && e.ticker === ticker));
    const td = _inEtf ? window.etfData : _inCetf ? window.cetfData
             : (mkt === 'us' ? window.usData : mkt === 'a' ? window.aData : window.trendData);
    if (Array.isArray(list)) {                       // 显式列表 (子行业成分股钻取)
      _chartList = list; _chartIdx = list.indexOf(ticker);
    } else if (_chartScreen === 'lifecycle') {       // 生命周期: 按显示顺序(板块V1→SATA)
      const _all = (window.trendData || {}).all_stocks || [];
      const _me = _all.find(s => s.ticker === ticker);
      if (_me && _me.sub) {
        _chartList = (window.__lcNavOrder || {})[_me.sub]
          || _all.filter(s => s.sub === _me.sub).map(s => s.ticker);
        _chartIdx = _chartList.indexOf(ticker);
      } else { _chartList = []; _chartIdx = -1; }
    } else if (_chartScreen === 'bottom') {         // Part3②: 4+个股翻页
      const _all = (window.trendData || {}).all_stocks || [];
      _chartList = _all.filter(s => s.sub === '4+')
        .sort((a, b) => ((b.sector_v1 || 0) - (a.sector_v1 || 0)) || (b.sata_w || 0) - (a.sata_w || 0))
        .map(s => s.ticker);
      _chartIdx = _chartList.indexOf(ticker);
    } else if (_chartScreen === 't12' || _chartScreen === 't34') {   // 阶段转换组
      _chartList = (window.__transNav || {})[_chartScreen] || [];
      _chartIdx = _chartList.indexOf(ticker);
    } else if (_chartScreen && td && Array.isArray(td[_chartScreen])) {
      _chartList = td[_chartScreen].map(p => p.ticker);
      _chartIdx = _chartList.indexOf(ticker);
    } else { _chartList = []; _chartIdx = -1; }
    document.getElementById('chart-modal').classList.add('open');
    document.getElementById('modal-name').textContent = stockName(ticker);
    const _sat = stockSATA(ticker);
    const _mb = [];
    if (_sat && _sat.stage) _mb.push(`<b style="color:${_sat.stage === '2' ? 'var(--positive)' : _sat.stage === '4' ? 'var(--negative)' : 'var(--text)'}">Stage ${_sat.stage}</b>${_sat.stage_days != null ? ` <span class="muted-val">(${_sat.stage_days}d)</span>` : ''}`);
    if (_sat && _sat.sub) {
      const _sh = (_sat.sub_hist || []).filter(h => h[0] <= 20).map(h => `${h[1]}·${h[0]}d前`);
      const _mk = (_sat.marks && _sat.marks.length) ? ` <b style="color:#f59e0b">${_sat.marks.join('·')}</b>` : '';
      _mb.push(`子档 <b style="color:${SUB_COLOR[_sat.sub] || 'var(--text)'}">${_sat.sub}</b>${_sat.prov ? ' <b style="color:#f59e0b;font-size:11px">新·弱规则(上市<253日)</b>' : ''}${_mk}${_sat.sub_days != null ? `·${_sat.sub_days}d` : ''}${_sh.length ? ` <span class="muted-val">(${_sh.join(' ← ')})</span>` : ''}`);
    }
    if (_sat && _sat.t12 != null && _sat.t12 <= 10) _mb.push(`<b style="color:var(--positive)">1→2 ${_sat.t12}天前</b>`);
    if (_sat && _sat.t34 != null && _sat.t34 <= 10) _mb.push(`<b style="color:var(--negative)">3→4 ${_sat.t34}天前</b>`);
    if (_sat && (_sat.sata_d != null || _sat.sata_w != null)) _mb.push(`SATA <b>${_sat.sata_d != null ? _sat.sata_d : '-'}</b>/<b>${_sat.sata_w != null ? _sat.sata_w : '-'}</b>`);
    if (_sat) {
      const _sy = fundLv(_sat.sales_yoy4), _py = fundLv(_sat.profit_yoy4), _ro = fundLv(_sat.roe4);
      if (_sy != null || _py != null || _ro != null)
        _mb.push(`营收${yoyLvCell(_sy)} 净利${yoyLvCell(_py)} ROE${roeLvCell(_ro)}`);
    }
    document.getElementById('modal-industry').innerHTML = stockIndustry(ticker)
      + (_mb.length ? '　' + _mb.join('　·　') : '');
    document.getElementById('modal-ticker').textContent =
      ticker + (_chartIdx >= 0 ? `   (${_chartIdx + 1}/${_chartList.length})  ←→切换 D/W日周` : '');
    _updateIntervalBtns();
    // 东吴信号图例 (chartdata含ds标记时显示)
    try {
      const lg = document.getElementById('modal-ds-legend');
      lg.textContent = (Array.isArray(_chartData.ds) && _chartData.ds.length)
        ? 'B/b 东吴买 · S/s 东吴卖' : '';
    } catch (e) {}
    document.body.style.overflow = 'hidden';

    const code = ticker.replace(/\.(HK|US|SH|SZ|BJ)$/, '');
    try {
      const res = await fetch(`./data/chartdata/${mkt}/${code}.json`);
      if (!res.ok) throw new Error(res.status);
      _chartData = await res.json();
      requestAnimationFrame(() => requestAnimationFrame(() => renderChart()));
    } catch (e) {
      document.getElementById('chart-main').innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted)">Chart data unavailable for ' + ticker + '</div>';
    }
  }

  function switchInterval(iv) {
    _chartInterval = iv;
    _updateIntervalBtns();
    requestAnimationFrame(() => renderChart());
  }

  function closeChart() {
    if (_charts) { _charts.forEach(c => c.remove()); _charts = null; }
    _chartData = null;
    document.getElementById('chart-modal').classList.remove('open');
    document.body.style.overflow = '';
  }

  function _updateIntervalBtns() {
    document.getElementById('btn-daily').classList.toggle('active', _chartInterval === 'D');
    document.getElementById('btn-weekly').classList.toggle('active', _chartInterval === 'W');
  }

  function navChart(dir) {
    if (!_chartList.length || _chartIdx < 0) return;
    const ni = _chartIdx + dir;
    if (ni < 0 || ni >= _chartList.length) return;
    showChart(_chartList[ni], _chartScreen, _chartList);
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { closeChart(); closeSector(); return; }
    const chartOpen = document.getElementById('chart-modal').classList.contains('open');
    const sectorOpen = document.getElementById('sector-modal').classList.contains('open');
    if (chartOpen) {
      if (_chartScreen === 'industry-chart') {
        if (e.key === 'ArrowUp') { e.preventDefault(); navIndustry(-1); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); navIndustry(1); }
        else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); switchInterval(_chartInterval === 'D' ? 'W' : 'D'); }
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); navChart(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); navChart(-1); }
      else if (e.key === 'd' || e.key === 'D') { e.preventDefault(); switchInterval('D'); }
      else if (e.key === 'w' || e.key === 'W') { e.preventDefault(); switchInterval('W'); }
    } else if (sectorOpen) {
      const dir = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ? -1 : 0;
      if (dir) { e.preventDefault(); window.navDetail(dir); }
    }
  });
  </script>
</body>
